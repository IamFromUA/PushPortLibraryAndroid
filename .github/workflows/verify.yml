name: Verify Android SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check SDK and build local Maven artifacts
        run: bash ./gradlew --no-daemon check publishReleasePublicationToLocalReleaseRepository
      - name: Verify publication metadata and notices
        run: python3 scripts/verify-publication.py
      - name: Compile Kotlin and Java consumer with R8
        run: bash ./gradlew --no-daemon -p examples/sdk-consumer assembleDebug assembleRelease lint
